name: Grafana Cloud Apply

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Select grafana-cloud to apply Grafana Cloud IaC from main.
        required: true
        type: choice
        options:
          - grafana-cloud

permissions:
  contents: read  # Required to check out the GitOps-managed Grafana Cloud IaC.

concurrency:
  group: grafana-cloud-apply
  queue: max
  cancel-in-progress: false

jobs:
  audit-production-vps-policy:
    name: Audit production-vps environment protection
    if: ${{ github.repository == 'ramideltoro/nutsnews-infra' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/production-vps-environment-policy-audit.yml

  apply:
    name: Protected OpenTofu apply
    if: ${{ github.repository == 'ramideltoro/nutsnews-infra' && github.ref == 'refs/heads/main' }}
    needs: audit-production-vps-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-vps

    steps:
      - name: Validate dispatch guard
        shell: bash
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Grafana Cloud apply must run from main." >&2
            exit 1
          fi

          if [[ "$CONFIRM_APPLY" != "grafana-cloud" ]]; then
            echo "Apply requires confirm_apply to be exactly grafana-cloud." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          tofu_wrapper: false

      - name: Prepare apply inputs
        shell: bash
        env:
          NUTSNEWS_GRAFANA_CLOUD_TOFU_BACKEND_CONFIG: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_TOFU_BACKEND_CONFIG }}
          NUTSNEWS_GRAFANA_CLOUD_URL: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_URL }}
          NUTSNEWS_GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN }}
          NUTSNEWS_GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID }}
          NUTSNEWS_GRAFANA_CLOUD_LOKI_DATASOURCE_UID: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_LOKI_DATASOURCE_UID }}
          NUTSNEWS_GRAFANA_CLOUD_USAGE_DATASOURCE_UID: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_USAGE_DATASOURCE_UID }}
          NUTSNEWS_EMAIL_TO: ${{ secrets.NUTSNEWS_EMAIL_TO }}
          NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN }}
          NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL }}
          NUTSNEWS_GRAFANA_SYNTHETIC_PROBE_IDS_JSON: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_PROBE_IDS_JSON }}
          NUTSNEWS_GRAFANA_SYNTHETIC_HTTP_CHECKS_JSON: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_HTTP_CHECKS_JSON }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            NUTSNEWS_GRAFANA_CLOUD_TOFU_BACKEND_CONFIG \
            NUTSNEWS_GRAFANA_CLOUD_URL \
            NUTSNEWS_GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN \
            NUTSNEWS_GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID \
            NUTSNEWS_GRAFANA_CLOUD_LOKI_DATASOURCE_UID \
            NUTSNEWS_GRAFANA_CLOUD_USAGE_DATASOURCE_UID \
            NUTSNEWS_EMAIL_TO \
            NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN \
            NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL \
            NUTSNEWS_GRAFANA_SYNTHETIC_PROBE_IDS_JSON \
            NUTSNEWS_GRAFANA_SYNTHETIC_HTTP_CHECKS_JSON
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required production-vps environment secret for Grafana Cloud apply: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate JSON inputs
        shell: bash
        env:
          NUTSNEWS_GRAFANA_CLOUD_URL: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_URL }}
          NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN }}
          NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL }}
          NUTSNEWS_GRAFANA_SYNTHETIC_PROBE_IDS_JSON: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_PROBE_IDS_JSON }}
          NUTSNEWS_GRAFANA_SYNTHETIC_HTTP_CHECKS_JSON: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_HTTP_CHECKS_JSON }}
          NUTSNEWS_GRAFANA_SYNTHETIC_MAJOR_FORECAST_ACKNOWLEDGED: ${{ vars.NUTSNEWS_GRAFANA_SYNTHETIC_MAJOR_FORECAST_ACKNOWLEDGED || 'false' }}
        run: |
          set -euo pipefail
          python3 terraform/grafana-cloud/scripts/validate_synthetic_monitoring_inputs.py \
            --output "$RUNNER_TEMP/grafana-cloud-input-validation.json"

      - name: Run Grafana Cloud apply
        shell: bash
        env:
          NUTSNEWS_GRAFANA_CLOUD_TOFU_BACKEND_CONFIG: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_TOFU_BACKEND_CONFIG }}
          TF_VAR_grafana_url: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_URL }}
          TF_VAR_grafana_service_account_token: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN }}
          TF_VAR_prometheus_datasource_uid: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID }}
          TF_VAR_loki_datasource_uid: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_LOKI_DATASOURCE_UID }}
          TF_VAR_usage_datasource_uid: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_USAGE_DATASOURCE_UID }}
          TF_VAR_operations_email_recipients: ${{ secrets.NUTSNEWS_EMAIL_TO }}
          TF_VAR_synthetic_monitoring_probe_ids: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_PROBE_IDS_JSON || '[]' }}
          TF_VAR_synthetic_http_checks: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_HTTP_CHECKS_JSON || '{}' }}
          TF_VAR_synthetic_major_forecast_acknowledged: ${{ vars.NUTSNEWS_GRAFANA_SYNTHETIC_MAJOR_FORECAST_ACKNOWLEDGED || 'false' }}
          TF_VAR_worker_terminal_slo_alerting_enabled: ${{ vars.NUTSNEWS_WORKER_TERMINAL_SLO_ALERTING_ENABLED || 'false' }}
          GRAFANA_SM_ACCESS_TOKEN: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN }}
          GRAFANA_SM_URL: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL }}
        run: |
          set -euo pipefail

          umask 077
          printf '%s\n' "$NUTSNEWS_GRAFANA_CLOUD_TOFU_BACKEND_CONFIG" > "$RUNNER_TEMP/grafana-backend.hcl"

          tofu fmt -check -recursive terraform/grafana-cloud
          python3 terraform/grafana-cloud/tests/validate_dashboard_definitions.py
          python3 terraform/grafana-cloud/tests/validate_grafana_ownership.py
          python3 terraform/grafana-cloud/tests/validate_worker_uplift_telemetry_scope.py
          python3 terraform/grafana-cloud/tests/validate_worker_uplift_rabbitmq_dashboards.py
          python3 terraform/grafana-cloud/tests/validate_worker_uplift_alerts_slos.py
          python3 terraform/grafana-cloud/tests/test_validate_synthetic_monitoring_inputs.py
          python3 terraform/grafana-cloud/tests/validate_observability_enhancements.py
          python3 terraform/grafana-cloud/tests/test_verify_post_apply.py
          python3 terraform/grafana-cloud/tests/test_notification_canary.py
          python3 terraform/grafana-cloud/tests/test_deployment_annotation.py
          tofu -chdir=terraform/grafana-cloud init -input=false -backend-config="$RUNNER_TEMP/grafana-backend.hcl"
          tofu -chdir=terraform/grafana-cloud validate -no-color
          tofu -chdir=terraform/grafana-cloud plan -input=false -no-color -out="$RUNNER_TEMP/grafana-cloud.tfplan"
          tofu -chdir=terraform/grafana-cloud apply -input=false -no-color "$RUNNER_TEMP/grafana-cloud.tfplan"
          tofu -chdir=terraform/grafana-cloud output -json > "$RUNNER_TEMP/grafana-cloud-outputs.json"

      - name: Verify Grafana Cloud resources and telemetry
        shell: bash
        env:
          TF_VAR_grafana_url: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_URL }}
          TF_VAR_grafana_service_account_token: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN }}
          TF_VAR_prometheus_datasource_uid: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID }}
          TF_VAR_loki_datasource_uid: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_LOKI_DATASOURCE_UID }}
          TF_VAR_usage_datasource_uid: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_USAGE_DATASOURCE_UID }}
          GRAFANA_SM_ACCESS_TOKEN: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN }}
          GRAFANA_SM_URL: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL }}
          NUTSNEWS_GRAFANA_SYNTHETIC_HTTP_CHECKS_JSON: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_HTTP_CHECKS_JSON }}
        run: |
          set -euo pipefail

          python3 terraform/grafana-cloud/scripts/verify_post_apply.py \
            --require-query-data \
            --terraform-outputs "$RUNNER_TEMP/grafana-cloud-outputs.json" \
            --output "$RUNNER_TEMP/grafana-cloud-post-apply-verification.json"

      - name: Upload Grafana Cloud verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: grafana-cloud-post-apply-verification
          path: ${{ runner.temp }}/grafana-cloud-post-apply-verification.json
          if-no-files-found: error

      - name: Upload value-free Synthetic Monitoring input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: grafana-cloud-input-validation
          path: ${{ runner.temp }}/grafana-cloud-input-validation.json
          if-no-files-found: error
