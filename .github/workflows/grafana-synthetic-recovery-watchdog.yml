name: Grafana Synthetic Recovery Watchdog
run-name: Synthetic recovery watchdog / ${{ inputs.parent_run_id }}-${{ inputs.parent_run_attempt }} / ${{ inputs.synthetic_check }}

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: Exact Grafana failure-drill workflow run ID.
        required: true
        type: string
      parent_run_attempt:
        description: Exact Grafana failure-drill workflow run attempt.
        required: true
        type: string
      parent_head_sha:
        description: Exact reviewed main revision used by the parent drill.
        required: true
        type: string
      synthetic_check:
        description: Exact approved check whose current configuration must be recoverable.
        required: true
        type: choice
        options:
          - canonical_articles_api
          - canonical_homepage
          - canonical_readiness
          - vercel_secondary_readiness
          - vps_readiness
      synthetic_variant:
        description: Exact assertion family selected by the parent drill.
        required: true
        type: choice
        options:
          - status
          - body
          - header
      watchdog_nonce:
        description: One-use 256-bit correlation nonce generated by the parent drill.
        required: true
        type: string

permissions:
  actions: read  # Verify the exact live parent and poll its sanitized release artifact.
  contents: read

concurrency:
  group: grafana-synthetic-recovery-${{ inputs.synthetic_check }}
  queue: max
  cancel-in-progress: false

jobs:
  audit-production-vps-policy:
    name: Audit production-vps environment protection
    if: ${{ github.repository == 'ramideltoro/nutsnews-infra' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/production-vps-environment-policy-audit.yml

  watchdog:
    name: Hold a private exact snapshot and guarantee bounded restoration
    if: ${{ github.repository == 'ramideltoro/nutsnews-infra' && github.ref == 'refs/heads/main' }}
    needs: audit-production-vps-policy
    runs-on: ubuntu-latest
    timeout-minutes: 170
    environment: production-vps

    steps:
      - name: Checkout the exact reviewed parent revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.parent_head_sha }}

      - name: Validate exact live parent identity before protected access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
          PARENT_HEAD_SHA: ${{ inputs.parent_head_sha }}
          WATCHDOG_NONCE: ${{ inputs.watchdog_nonce }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Synthetic recovery watchdogs may run only through main workflow_dispatch." >&2
            exit 1
          fi
          if [[ ! "$PARENT_RUN_ID" =~ ^[0-9]{6,20}$ || ! "$PARENT_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "Parent workflow identity is invalid." >&2
            exit 1
          fi
          if [[ ! "$PARENT_HEAD_SHA" =~ ^[a-f0-9]{40}$ || ! "$WATCHDOG_NONCE" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Parent revision or watchdog nonce is invalid." >&2
            exit 1
          fi

          parent="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          jq -e \
            --argjson run_id "$PARENT_RUN_ID" \
            --argjson run_attempt "$PARENT_RUN_ATTEMPT" \
            --arg head_sha "$PARENT_HEAD_SHA" '
              (.id == $run_id) and
              (.run_attempt == $run_attempt) and
              (.head_sha == $head_sha) and
              (.head_branch == "main") and
              (.event == "workflow_dispatch") and
              (.path == ".github/workflows/grafana-failure-drill.yml") and
              (.status == "in_progress") and
              (.conclusion == null)
            ' <<< "$parent" > /dev/null

      - name: Validate watchdog and synthetic drill implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            terraform/grafana-cloud/scripts/exercise_synthetic_failure_drill.py \
            terraform/grafana-cloud/tests/test_synthetic_failure_drill.py \
            terraform/grafana-cloud/tests/test_synthetic_recovery_watchdog_workflow.py
          python3 terraform/grafana-cloud/tests/test_synthetic_failure_drill.py
          python3 terraform/grafana-cloud/tests/test_synthetic_recovery_watchdog_workflow.py

      - name: Fetch exact remote check and arm private recovery snapshot
        id: arm
        shell: bash
        env:
          GRAFANA_SM_URL: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL }}
          GRAFANA_SM_ACCESS_TOKEN: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN }}
          SYNTHETIC_CHECK: ${{ inputs.synthetic_check }}
          SYNTHETIC_VARIANT: ${{ inputs.synthetic_variant }}
          WATCHDOG_NONCE: ${{ inputs.watchdog_nonce }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
          PARENT_HEAD_SHA: ${{ inputs.parent_head_sha }}
        run: |
          set -euo pipefail
          umask 077
          install -m 0700 -d \
            "$RUNNER_TEMP/synthetic-watchdog-private" \
            "$RUNNER_TEMP/synthetic-watchdog-armed"
          python3 terraform/grafana-cloud/scripts/exercise_synthetic_failure_drill.py watchdog-arm \
            --target "$SYNTHETIC_CHECK" \
            --variant "$SYNTHETIC_VARIANT" \
            --snapshot "$RUNNER_TEMP/synthetic-watchdog-private/exact-remote-check.json" \
            --watchdog-nonce "$WATCHDOG_NONCE" \
            --parent-run-id "$PARENT_RUN_ID" \
            --parent-run-attempt "$PARENT_RUN_ATTEMPT" \
            --parent-head-sha "$PARENT_HEAD_SHA" \
            --watchdog-run-id "$GITHUB_RUN_ID" \
            --watchdog-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/synthetic-watchdog-armed/armed.json"
          test "$(stat -c '%a' "$RUNNER_TEMP/synthetic-watchdog-private/exact-remote-check.json")" = "600"
          jq -e '
            (.safe_metadata_only == true) and
            (.status == "armed") and
            (.snapshot_ready == true) and
            (.exact_restore_payload_ready == true) and
            (.private_snapshot_uploaded == false) and
            (.mutation_performed == false)
          ' "$RUNNER_TEMP/synthetic-watchdog-armed/armed.json" > /dev/null

      - name: Publish sanitized armed recovery handshake
        if: steps.arm.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: synthetic-recovery-watchdog-armed-${{ inputs.parent_run_id }}-${{ inputs.parent_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synthetic-watchdog-armed/armed.json
          if-no-files-found: error
          retention-days: 90

      - name: Wait bounded time for parent release or termination
        if: always() && steps.arm.outcome == 'success'
        id: wait_for_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
          PARENT_HEAD_SHA: ${{ inputs.parent_head_sha }}
          WATCHDOG_NONCE: ${{ inputs.watchdog_nonce }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$RUNNER_TEMP/synthetic-watchdog-release"
          expected_artifact="synthetic-recovery-watchdog-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          nonce_sha256="$(printf '%s' "$WATCHDOG_NONCE" | sha256sum | cut -d ' ' -f 1)"
          deadline=$((SECONDS + 7200))
          wait_status="timeout"
          release_observed=false

          while (( SECONDS < deadline )); do
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100")"
            match_count="$(jq --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "$artifacts")"
            if [[ "$match_count" == "1" ]]; then
              artifact_id="$(jq -r --arg name "$expected_artifact" '.artifacts[] | select(.name == $name and .expired == false) | .id' <<< "$artifacts")"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                > "$RUNNER_TEMP/synthetic-watchdog-release/release.zip"
              unzip -q "$RUNNER_TEMP/synthetic-watchdog-release/release.zip" \
                -d "$RUNNER_TEMP/synthetic-watchdog-release/downloaded"
              release="$RUNNER_TEMP/synthetic-watchdog-release/downloaded/release.json"
              if [[ -f "$release" ]] && jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                --argjson parent_run_id "$PARENT_RUN_ID" \
                --argjson parent_run_attempt "$PARENT_RUN_ATTEMPT" \
                --arg parent_head_sha "$PARENT_HEAD_SHA" \
                --argjson watchdog_run_id "$GITHUB_RUN_ID" \
                --argjson watchdog_run_attempt "$GITHUB_RUN_ATTEMPT" \
                --arg nonce_sha256 "$nonce_sha256" '
                  ((keys | sort) == [
                    "parent_head_sha", "parent_recovery_observed", "parent_repository",
                    "parent_run_attempt", "parent_run_id", "release_requested_at",
                    "request_exact_restore", "safe_metadata_only", "schema_version", "status",
                    "watchdog_nonce_sha256", "watchdog_run_attempt", "watchdog_run_id"
                  ]) and
                  (.schema_version == 1) and
                  (.safe_metadata_only == true) and
                  (.status == "release-requested") and
                  (.request_exact_restore == true) and
                  (.parent_repository == $repository) and
                  (.parent_run_id == $parent_run_id) and
                  (.parent_run_attempt == $parent_run_attempt) and
                  (.parent_head_sha == $parent_head_sha) and
                  (.watchdog_run_id == $watchdog_run_id) and
                  (.watchdog_run_attempt == $watchdog_run_attempt) and
                  (.watchdog_nonce_sha256 == $nonce_sha256) and
                  (.parent_recovery_observed | type == "boolean") and
                  (.release_requested_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
                ' "$release" > /dev/null; then
                wait_status="parent-release"
                release_observed=true
              else
                wait_status="invalid-release"
              fi
              break
            fi
            if [[ "$match_count" != "0" ]]; then
              wait_status="ambiguous-release"
              break
            fi

            parent="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
            parent_status="$(jq -r '.status' <<< "$parent")"
            if [[ "$parent_status" == "completed" ]]; then
              wait_status="parent-terminated"
              break
            fi
            sleep 10
          done

          jq -n \
            --arg status "$wait_status" \
            --argjson release_observed "$release_observed" \
            --arg waited_until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson max_hold_seconds 7200 '
              {
                schema_version: 1,
                safe_metadata_only: true,
                status: $status,
                release_observed: $release_observed,
                max_hold_seconds: $max_hold_seconds,
                waited_until: $waited_until
              }
            ' > "$RUNNER_TEMP/synthetic-watchdog-wait.json"

      - name: Exact-restore and verify after release or bounded wait
        if: always() && steps.arm.outcome == 'success'
        id: restore
        continue-on-error: true
        shell: bash
        env:
          GRAFANA_SM_URL: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_URL }}
          GRAFANA_SM_ACCESS_TOKEN: ${{ secrets.NUTSNEWS_GRAFANA_SYNTHETIC_MONITORING_ACCESS_TOKEN }}
          GRAFANA_URL: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN }}
          GRAFANA_PROMETHEUS_DATASOURCE_UID: ${{ secrets.NUTSNEWS_GRAFANA_CLOUD_PROMETHEUS_DATASOURCE_UID }}
          SYNTHETIC_CHECK: ${{ inputs.synthetic_check }}
          SYNTHETIC_VARIANT: ${{ inputs.synthetic_variant }}
        run: |
          set -euo pipefail
          python3 terraform/grafana-cloud/scripts/exercise_synthetic_failure_drill.py restore \
            --target "$SYNTHETIC_CHECK" \
            --variant "$SYNTHETIC_VARIANT" \
            --target-confirmation "$SYNTHETIC_CHECK" \
            --confirmation "recover-grafana-failure-drill:${SYNTHETIC_CHECK}:synthetic-mismatch" \
            --snapshot "$RUNNER_TEMP/synthetic-watchdog-private/exact-remote-check.json" \
            --timeout-seconds 1200 \
            --output "$RUNNER_TEMP/synthetic-watchdog-restore.json"

      - name: Finalize sanitized independent recovery evidence
        if: always()
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          install -m 0700 -d \
            "$RUNNER_TEMP/synthetic-watchdog-armed" \
            "$RUNNER_TEMP/synthetic-watchdog-private"
          armed="$RUNNER_TEMP/synthetic-watchdog-armed/armed.json"
          wait_report="$RUNNER_TEMP/synthetic-watchdog-wait.json"
          restore="$RUNNER_TEMP/synthetic-watchdog-restore.json"
          [[ -f "$armed" ]] || jq -n '{schema_version: 1, result: "not-armed"}' > "$armed"
          [[ -f "$wait_report" ]] || jq -n '{schema_version: 1, status: "wait-failed", release_observed: false}' > "$wait_report"
          [[ -f "$restore" ]] || jq -n '{schema_version: 1, result: "not-restored"}' > "$restore"
          jq -s '
            .[0] as $armed | .[1] as $wait | .[2] as $restore |
            {
              schema_version: 1,
              safe_metadata_only: true,
              workflow: "grafana-synthetic-recovery-watchdog",
              drill: "synthetic-mismatch",
              target: ($armed.target // "unknown"),
              variant: ($armed.variant // "unknown"),
              parent_repository: ($armed.parent_repository // "unknown"),
              parent_run_id: ($armed.parent_run_id // 0),
              parent_run_attempt: ($armed.parent_run_attempt // 0),
              parent_head_sha: ($armed.parent_head_sha // "unknown"),
              watchdog_run_id: ($armed.watchdog_run_id // 0),
              watchdog_run_attempt: ($armed.watchdog_run_attempt // 0),
              watchdog_nonce_sha256: ($armed.watchdog_nonce_sha256 // "unknown"),
              armed: ($armed.result == "armed" and $armed.snapshot_ready == true),
              private_snapshot_uploaded: false,
              wait_status: ($wait.status // "wait-failed"),
              release_observed: ($wait.release_observed == true),
              restoration_attempted: ($restore.restoration_attempted == true),
              restore_write_performed: ($restore.restore_write_performed == true),
              restored: ($restore.restored == true),
              recovery_observed: ($restore.recovery_observed == true),
              alert_recovery_observed: ($restore.alert_recovery_observed == true),
              finished_at: ($restore.finished_at // $wait.waited_until // null),
              result: (if (
                ($armed.result == "armed") and
                ($wait.status == "parent-release" or $wait.status == "parent-terminated" or $wait.status == "timeout") and
                ($restore.result == "pass") and
                ($restore.restored == true) and
                ($restore.recovery_observed == true) and
                ($restore.alert_recovery_observed == true)
              ) then "pass" else "fail" end)
            }
          ' "$armed" "$wait_report" "$restore" > "$RUNNER_TEMP/synthetic-watchdog-final.json"
          jq -e '.result == "pass"' "$RUNNER_TEMP/synthetic-watchdog-final.json" > /dev/null

      - name: Upload sanitized independent recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: synthetic-recovery-watchdog-final-${{ inputs.parent_run_id }}-${{ inputs.parent_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synthetic-watchdog-final.json
          if-no-files-found: error
          retention-days: 90
