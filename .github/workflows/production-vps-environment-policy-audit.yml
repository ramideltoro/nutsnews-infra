name: Production VPS environment policy audit

on:
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read  # Required by GitHub's read-only environment policy endpoints.
  contents: read  # Required to check out the policy auditor at the caller revision.

concurrency:
  group: production-vps-environment-policy-audit-${{ github.repository }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  audit:
    name: Verify production-vps exact-main automatic policy
    if: ${{ github.repository == 'ramideltoro/nutsnews-infra' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout the exact caller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit protected environment policy without attaching it
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_production_vps_environment_policy.py
